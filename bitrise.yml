format_version: "26"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios

app:
  envs:
  - BITRISE_PROJECT_PATH: ios-simple-objc/ios-simple-objc.xcodeproj
  - BITRISE_SCHEME: ios-simple-objc
  - BITRISE_EXPORT_METHOD: development
  status_report_name: bitrise/<project_title>/<target_id>

pipelines:
  pr_check:
    triggers:
      pull_request:
      - target_branch: '*'
    workflows:
      test_min_xcode: {}
      test_latest_xcode: {}
      archive_min_xcode: {}
      archive_latest_xcode: {}

workflows:
  test_min_xcode:
    meta:
      bitrise.io:
        stack: osx-xcode-16.0.x
    steps:
    - bundle::run_tests: {}

  test_latest_xcode:
    meta:
      bitrise.io:
        stack: osx-xcode-latest-stable
    steps:
    - bundle::run_tests: {}

  archive_min_xcode:
    meta:
      bitrise.io:
        stack: osx-xcode-16.0.x
    steps:
    - bundle::build_archive: {}

  archive_latest_xcode:
    meta:
      bitrise.io:
        stack: osx-xcode-latest-stable
    steps:
    - bundle::build_archive: {}

step_bundles:
  run_tests:
    steps:
    - git-clone: {}
    - xcode-build-for-test:
        inputs:
        - automatic_code_signing: api-key
    - virtual-device-testing-for-ios:
        inputs:
        - test_devices: |-
            iphone8,16.6,en,portrait
            iphonese3,26.3,en,landscape
        - download_test_results: "true"
        - num_flaky_test_attempts: "2"
    - script:
        title: Collect the device test assets
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            assets="${VDTESTING_DOWNLOADED_FILES_DIR:-}"
            if [ -z "$assets" ] || [ ! -d "$assets" ]; then
              echo "No device test assets were downloaded."
              exit 0
            fi
            # The step downloads into a temp dir, which deploy-to-bitrise-io does not look at.
            (cd "$assets" && zip -qr "$BITRISE_DEPLOY_DIR/device-test-results.zip" .)
            echo "Collected device test assets into device-test-results.zip"
    - xcode-test:
        inputs:
        - project_path: $BITRISE_PROJECT_PATH
        - scheme: $BITRISE_SCHEME
    - deploy-to-bitrise-io:
        is_always_run: true

  build_archive:
    steps:
    - git-clone: {}
    - xcode-archive:
        inputs:
        - project_path: $BITRISE_PROJECT_PATH
        - scheme: $BITRISE_SCHEME
        - export_method: $BITRISE_EXPORT_METHOD
        - automatic_code_signing: api-key
    - deploy-to-bitrise-io: {}

meta:
  bitrise.io:
    machine_type_id: g2.mac.medium
    stack: osx-xcode-16.0.x
